<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết môn học — EduAI</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .chapter-item { border:1px solid var(--border-subtle); border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 14px; background:#fff; transition: border-color .15s, box-shadow .15s; }
  .chapter-item:hover { border-color: var(--indigo-500); }
  .chapter-item.open { border-color: var(--indigo-500); box-shadow: 0 2px 10px rgba(79,70,229,.10); }
  .chapter-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 12px 14px; cursor:pointer; user-select:none; }
  .chapter-head .name { font-weight:600; }
  .chapter-head .meta { display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:12px; white-space:nowrap; }
  .chapter-head .arrow { transition: transform .15s; }
  .chapter-item.open .arrow { transform: rotate(90deg); }
  .chapter-body { display:none; padding: 4px 14px 14px; border-top:1px dashed var(--border-subtle); }
  .chapter-item.open .chapter-body { display:block; }
  .chapter-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chapter-actions .btn { padding:7px 12px; font-size:13px; }
  .doc-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 10px 12px; border:1px solid var(--border-subtle); border-radius: var(--radius-sm); margin-top:8px; font-size: 14px; color:inherit; text-decoration:none; background:#fff; }
  a.doc-item:hover { border-color: var(--indigo-500); background: var(--indigo-50); }
  .doc-item .t { overflow:hidden; text-overflow:ellipsis; }
  .muted-note { color:var(--text-muted); font-size:13px; padding:8px 0; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr !important; } }
</style>
<link rel="stylesheet" href="../css/luxe.css">
</head>
<body>
<div class="app-shell">
  <nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-logo" href="dashboard.html"><span class="mark">E</span>EduAI</a>
    <div class="topnav-links">
    <a class="nav-item" href="dashboard.html">Dashboard</a>
    <a class="nav-item active" href="courses.html">Môn học</a>
    <a class="nav-item" href="documents.html">Tài liệu</a>
    <a class="nav-item" href="chatbot.html">Hỏi AI</a>
    <a class="nav-item" href="quiz-list.html">Ôn tập & Kiểm tra</a>
    <a class="nav-item" href="progress.html">Tiến độ học tập</a>
    <a class="nav-item" href="study.html">Kế hoạch & Ghi chú</a>
    </div>
  <div class="topnav-actions">
    <a class="nav-item" href="#" onclick="logout(); return false;">Đăng xuất</a>
  </div>
  </div>
  <div class="topnav-mobile">
    <a class="nav-item" href="dashboard.html">Dashboard</a>
    <a class="nav-item active" href="courses.html">Môn học</a>
    <a class="nav-item" href="documents.html">Tài liệu</a>
    <a class="nav-item" href="chatbot.html">Hỏi AI</a>
    <a class="nav-item" href="quiz-list.html">Ôn tập & Kiểm tra</a>
    <a class="nav-item" href="progress.html">Tiến độ học tập</a>
    <a class="nav-item" href="study.html">Kế hoạch & Ghi chú</a>
    <a class="nav-item" href="#" onclick="logout(); return false;">Đăng xuất</a>
  </div>
</nav>
  <main class="main-content">
    <a href="courses.html" style="font-size:13px; color:var(--text-secondary); display:inline-block; margin-bottom:10px;">← Quay lại Môn học</a>
    <section class="page-hero" id="courseHero">
      <div class="copy">
        <h2 id="courseTitle">Đang tải...</h2>
        <p id="courseDesc"></p>
        <div class="hero-cta"><button class="solid" id="askAiBtn">💬 Hỏi AI về môn học này</button></div>
      </div>
      <div class="hero-art" id="courseIcon">📘</div>
    </section>

    <div class="grid two-col" style="grid-template-columns:1fr 1fr; gap:20px; align-items:start;">
      <div class="card">
        <h3 style="margin-top:0;">Danh sách chương</h3>
        <div id="chapterList"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Tài liệu</h3>
        <div id="docList"></div>
      </div>
    </div>
  </main>
</div>
<script src="../js/api.js"></script>
<script>
requireRole("STUDENT");
const id = new URLSearchParams(window.location.search).get("id");

function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let courseName = "";
let docsById = {};

function docLink(d) {
  const empty = d.chunk_count === 0;
  return `<a class="doc-item" href="document-view.html?id=${d.id}">
    <span class="t">📄 ${esc(d.title)}</span>
    <span class="badge ${empty ? 'badge-amber' : 'badge-blue'}">${empty ? 'chưa có nội dung' : esc((d.file_type || '').toUpperCase())}</span>
  </a>`;
}

function toggleChapter(el) { el.closest(".chapter-item").classList.toggle("open"); }

function askChapter(name) {
  window.location.href = `chatbot.html?course=${encodeURIComponent(courseName)}&q=${encodeURIComponent("Tóm tắt nội dung: " + name)}`;
}

function quizCourse() {
  window.location.href = `quiz-list.html?course=${encodeURIComponent(courseName)}`;
}

async function load() {
  const data = await Api.course(id);
  courseName = data.course.name;
  document.getElementById("courseTitle").textContent = courseName;
  document.getElementById("courseDesc").textContent = data.course.description || "";
  document.getElementById("courseHero").style.cssText = courseCover(courseName);
  document.getElementById("courseIcon").textContent = courseTheme(courseName).icon;
  document.getElementById("askAiBtn").onclick = () => {
    window.location.href = `chatbot.html?course=${encodeURIComponent(courseName)}`;
  };
  data.documents.forEach(d => { docsById[d.id] = d; });

  document.getElementById("chapterList").innerHTML = data.chapters.length
    ? data.chapters.map((c, i) => {
        const docs = (c.document_ids || []).map(x => docsById[x]).filter(Boolean);
        return `<div class="chapter-item" id="ch${c.id}">
          <div class="chapter-head" onclick="toggleChapter(this)">
            <span class="name">${esc(c.name)}</span>
            <span class="meta">${docs.length ? docs.length + " tài liệu" : "Chưa có tài liệu"} <span class="arrow">▸</span></span>
          </div>
          <div class="chapter-body">
            ${docs.length ? docs.map(docLink).join("") : `<div class="muted-note">Chương này chưa có tài liệu. Bạn vẫn có thể hỏi AI về nội dung chương.</div>`}
            <div class="chapter-actions">
              <button class="btn btn-primary" onclick='askChapter(${JSON.stringify(c.name)})'>💬 Hỏi AI về chương này</button>
              <button class="btn btn-secondary" onclick="quizCourse()">📝 Làm câu hỏi ôn tập</button>
            </div>
          </div>
        </div>`;
      }).join("")
    : `<div class="muted-note">Chưa có chương nào.</div>`;

  // Mở sẵn chương đầu tiên để người dùng thấy ngay cách dùng
  const first = document.querySelector(".chapter-item");
  if (first) first.classList.add("open");

  document.getElementById("docList").innerHTML = data.documents.length
    ? data.documents.map(docLink).join("")
    : `<div class="muted-note">Môn học này chưa có tài liệu. Bạn vẫn có thể bấm "Hỏi AI về môn học này" để tra cứu kiến thức có sẵn.</div>`;
}
load();
</script>
</body>
</html>
